name: ci

on:
  push:
    branches: [main]
  pull_request:

# Sane defaults: stop in-progress jobs on the same branch when a new commit
# lands, never run two CI jobs for the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sim_core/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('sim_core/Cargo.lock', 'sim_core/**/Cargo.toml') }}

      - name: Format check
        working-directory: sim_core
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: sim_core
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sim_core/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('sim_core/Cargo.lock', 'sim_core/**/Cargo.toml') }}

      - name: Test (workspace, default features)
        working-directory: sim_core
        run: cargo test --workspace --all-targets

  build_gdext:
    name: Build GDExtension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sim_core/target
          key: ${{ runner.os }}-cargo-gdext-${{ hashFiles('sim_core/Cargo.lock', 'sim_core/**/Cargo.toml') }}

      - name: Build babel_gd (release, --features gdext)
        working-directory: sim_core
        run: cargo build -p babel_gd --features gdext --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: babel_gd-${{ runner.os }}
          path: |
            sim_core/target/release/libbabel_gd.so
            sim_core/target/release/babel_gd.dll
            sim_core/target/release/libbabel_gd.dylib
          if-no-files-found: ignore

  godot_smoke:
    name: Godot 4.3 headless smoke test
    runs-on: ubuntu-24.04
    needs: build_gdext
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sim_core/target
          key: Linux-cargo-gdext-${{ hashFiles('sim_core/Cargo.lock', 'sim_core/**/Cargo.toml') }}

      - name: Build GDExtension (debug)
        run: ./tools/build_gdext.sh debug

      - name: Install Godot 4.3
        run: |
          mkdir -p "$HOME/godot"
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.3-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --editor --import --path godot_project

      - name: Run project (headless) and verify extension loads
        run: |
          set -o pipefail
          out=$(godot --headless --path godot_project --quit 2>&1 | tee /dev/stderr)
          # The autoload prints this exact line iff BabelSim was registered.
          echo "$out" | grep -F "[GameState] BabelSim extension loaded."
          # And no stub fallbacks should fire.
          if echo "$out" | grep -F "BabelSim extension NOT loaded"; then
            echo "::error::BabelSim failed to register at runtime"
            exit 1
          fi

      - name: Run sim-invariant headless tests
        run: |
          set -o pipefail
          # `tests/run_all.gd` boots a fresh StubSim, advances 1000
          # sim-days at a fixed seed, and asserts a handful of
          # invariants (NPC survival, biome cleanup, determinism, ocean
          # fraction, asset presence). Any failure prints
          # `[run_all] FAIL · ...` and exits 1.
          godot --headless --path godot_project -s tests/run_all.gd 2>&1 | tee /tmp/run_all.log
          grep -F "[run_all] PASS" /tmp/run_all.log
